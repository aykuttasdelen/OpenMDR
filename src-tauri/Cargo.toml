[package]
name = "openmd"
version = "1.1.0"
description = "Modern, elegant Markdown & MDX Editor for macOS (Rust + Tauri v2 Edition)"
edition = "2024"
rust-version = "1.90"

[lib]
name = "openmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.16"

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
trash = "5.2"
base64 = "0.22"
rfd = "0.15"
walkdir = "2.5"
